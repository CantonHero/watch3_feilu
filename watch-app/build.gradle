buildscript {
    repositories {
        maven { url 'https://developer.huawei.com/repo/' }
        mavenCentral()
    }
    dependencies {
        classpath 'com.huawei.ohos:hap:3.1.2.0'
    }
}

apply plugin: 'com.huawei.ohos.app'

ohos {
    compileSdkVersion 6
    if (System.getenv('WATCH3_SIGN_STORE')) {
        signingConfigs {
            debug {
                storeFile file(System.getenv('WATCH3_SIGN_STORE'))
                storePassword System.getenv('WATCH3_SIGN_STORE_PASSWORD')
                keyAlias System.getenv('WATCH3_SIGN_ALIAS')
                keyPassword System.getenv('WATCH3_SIGN_KEY_PASSWORD')
                signAlg System.getenv('WATCH3_SIGN_ALGORITHM')
                profile file(System.getenv('WATCH3_SIGN_PROFILE'))
                certpath file(System.getenv('WATCH3_SIGN_CERTIFICATE'))
            }
        }
    }
}
